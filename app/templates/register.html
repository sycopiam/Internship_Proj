{% extends "base.html" %}

{% block title %}User Registration - ServiceFlow IT Service Desk{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom shadow-sm">
            <div class="card-header text-center bg-dark text-white py-3">
                <i class="bi bi-person-plus fs-2 text-info d-block mb-1"></i>
                <h4 class="mb-0 fw-bold">Create User Account</h4>
                <small class="text-muted">Join ServiceFlow Portal</small>
            </div>
            <div class="card-body p-4">
                <form action="/auth/register" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" placeholder="John Doe" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Work Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="john.doe@company.com" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="At least 6 characters" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                        <i class="bi bi-check-circle me-1"></i> Complete Registration
                    </button>
                </form>
                <div class="text-center mt-3 pt-3 border-top">
                    <span class="text-muted">Already registered?</span>
                    <a href="/auth/login" class="fw-semibold text-decoration-none ms-1">Log In Here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
